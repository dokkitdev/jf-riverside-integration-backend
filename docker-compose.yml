version: '3'

services:

  nginx:
    image: ronasit/php-nginx-dev:7.4
    working_dir: /app
    command: >
      bash -c "chmod +x ./docker/entrypoint.sh && ./docker/entrypoint.sh && cd /opt/docker && supervisord"
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./:/app
    links:
      - pgsql
      - pgsql_test
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      WEB_DOCUMENT_INDEX: index.php
      REDIS_PORT: "6379"
      php.xdebug.max_nesting_level: 250
      XDEBUG_PROFILER_ENABLE: 0
      XDEBUG_REMOTE_AUTOSTART: 1
      XDEBUG_DISCOVER_CLIENT_HOST: 0
      XDEBUG_REMOTE_PORT: 9000
      XDEBUG_REMOTE_HOST: 172.16.57.1
      PHP_IDE_CONFIG: "serverName=nginx"

  nginx_without_debug:
    image: ronasit/php-nginx:7.4
    working_dir: /app
    command: >
      bash -c "chmod +x ./docker/entrypoint.sh && ./docker/entrypoint.sh && cd /opt/docker && supervisord"
    ports:
      - 81:80
      - 444:443
    volumes:
      - ./:/app
    links:
      - pgsql
      - pgsql_test
    environment:
      WEB_DOCUMENT_ROOT: /app/public
      WEB_DOCUMENT_INDEX: index.php

  pgsql:
    image: ronasit/postgres:12.5
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: pguser
      POSTGRES_DB: pgdb
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - .:/app

  pgsql_test:
    image: ronasit/postgres:12.5
    ports:
      - 5433:5432
    environment:
      POSTGRES_PASSWORD: ""
      POSTGRES_USER: forge
      POSTGRES_DB: forge
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - .:/app
    command: ["-c", "fsync=off"]

  redis:
    image: redis:6.2.3
    ports:
      - 6379:6379

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.57.0/24
